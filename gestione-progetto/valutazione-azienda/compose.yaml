name: school-valutazione-azienda

services:
  test:
    profiles: ["tools"]
    image: node:20-bookworm-slim
    working_dir: /work
    volumes:
      - .:/work
      - node_modules:/work/node_modules
      - dist:/work/dist
      - npm_cache:/root/.npm
    command: sh -c "npm ci --prefer-offline --no-audit --no-fund && npm test"

volumes:
  node_modules:
  dist:
  npm_cache:
