name: school-fondamenti-sql

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: school_root_dev
      MARIADB_DATABASE: school_lab
      MARIADB_USER: school_user
      MARIADB_PASSWORD: school_dev
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 12

  admin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: db
      PMA_USER: school_user
      PMA_PASSWORD: school_dev
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
