name: school-api-04

x-php: &php
  build:
    context: ../docker/php
  working_dir: /work
  volumes:
    - .:/work

services:
  app:
    <<: *php
    command: php -S 0.0.0.0:8000 -t public
    environment:
      DB_DSN: mysql:host=db;dbname=shop_ex04;charset=utf8mb4
      DB_USER: school_user
      DB_PASSWORD: school_dev
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health.php') === false ? 1 : 0);"]
      interval: 2s
      timeout: 2s
      retries: 15

  test:
    profiles: ["tools"]
    <<: *php
    command: php tests/run.php

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: school_root_dev
      MARIADB_DATABASE: shop_ex04
      MARIADB_USER: school_user
      MARIADB_PASSWORD: school_dev
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 12

  admin:
    image: phpmyadmin:5.2-apache
    profiles: ["admin"]
    environment:
      PMA_HOST: db
      PMA_USER: school_user
      PMA_PASSWORD: school_dev
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

  client:
    image: curlimages/curl:8.11.1
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - .:/work:ro
    entrypoint: ["curl"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
