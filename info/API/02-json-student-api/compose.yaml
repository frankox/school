name: school-ex02

services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: school_ex02
      MARIADB_USER: school_api
      MARIADB_PASSWORD: school_dev
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - student_db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 12

  admin:
    image: phpmyadmin:5.2-apache
    profiles: ["admin"]
    environment:
      PMA_HOST: db
      PMA_USER: school_api
      PMA_PASSWORD: school_dev
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  student_db_data:
